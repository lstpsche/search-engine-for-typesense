name: CI

on:
  push:
    paths:
      - '.rubocop.yml'
      - '.github/workflows/ci.yml'
      - '**/*.rb'
      - '**/*.rake'
  workflow_dispatch:

jobs:
  rubocop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bin/rubocop -f github

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec bin/test

  rails-6-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Test classic and Zeitwerk hosts
        run: |
          export BUNDLE_GEMFILE="$RUNNER_TEMP/rails-6.1.gemfile"
          cat > "$BUNDLE_GEMFILE" <<'GEMS'
          source 'https://rubygems.org'
          gemspec path: ENV.fetch('GITHUB_WORKSPACE')
          gem 'rails', '~> 6.1.7'
          gem 'minitest', '< 6'
          GEMS
          bundle install
          bundle exec ruby -rlogger -Itest test/engine_boot_test.rb

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      typesense:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_DATA_DIR: /data
          TYPESENSE_API_KEY: query-fixture-key
        ports:
          - 8108:8108
        options: --memory=2g --tmpfs /data:rw,size=2g
    env:
      TYPESENSE_HOST: 127.0.0.1
      TYPESENSE_PORT: '8108'
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: query-fixture-key
      TYPESENSE_INTEGRATION: '1'
      TYPESENSE_TEST_ISOLATED: '1'
      TYPESENSE_EMBEDDING_INTEGRATION: '1'
      SEARCH_ENGINE_TEST_MODE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Wait for Typesense
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8108/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify server version
        run: |
          curl --fail --silent --header "X-TYPESENSE-API-KEY: $TYPESENSE_API_KEY" \
            http://127.0.0.1:8108/debug |
            ruby -rjson -e 'abort "Expected Typesense 30.2" unless JSON.parse(STDIN.read).fetch("version") == "30.2"'
      - run: bundle exec ruby -Itest test/geo_integration_test.rb
      - name: Query and schema integration
        run: >-
          bundle exec ruby -Itest -e 'ARGV.each { |file| require_relative file }'
          test/vector_integration_test.rb test/cache_integration_test.rb
          test/pagination_integration_test.rb test/filter_safety_integration_test.rb
          test/scoped_results_integration_test.rb test/schema_safety_integration_test.rb
      - run: bundle exec ruby examples/demo_shop/bin/query_smoke --live --auto-embedding

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: outbox-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_OUTBOX_POSTGRESQL_INTEGRATION: 'true'
      POSTGRES_OUTBOX_POSTGRESQL_URL: postgresql://postgres:outbox-fixture@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec ruby -Itest test/postgres_outbox_repository_postgresql_test.rb
